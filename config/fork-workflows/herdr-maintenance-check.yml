name: Maintained Herdr validation

# Install as .github/workflows/maintenance-check.yml in neuralyze/herdr after
# rendering both __TOOL_COMMIT__ values to the same trusted 40-hex tool commit.
# The updater explicitly dispatches this file at its candidate branch because
# GITHUB_TOKEN-created PR events do not reliably start PR-triggered workflows.
on:
  pull_request:
    branches: [maintained]
  push:
    branches: [maintained]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'neuralyze/herdr'
    uses: neuralyze/herdr-maintenance/.github/workflows/component-check.yml@__TOOL_COMMIT__
    with:
      product: herdr
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # github.workflow_sha is this caller, NOT the reusable tool commit.
      tool_ref: '__TOOL_COMMIT__'
