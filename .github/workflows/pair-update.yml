name: Watch approved maintained pair

# Operations: daily UTC watcher reads only the two maintained heads. It opens
# a lock PR and dispatches pair-check.yml on its bot branch; it never merges.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: paired-lock-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'neuralyze/herdr-maintenance' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Check out exact trusted watcher commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # upstream Herdr: checkout v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Propose a pair from approved fork heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m maintenance.updater --config config/products.json
          pair --lock config/pair.lock.json --workspace "$RUNNER_TEMP/pair-update"
          --output out/update.json --apply
      - name: Report paired update outcome
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('out/update.json')
          if not path.is_file():
              raise SystemExit('Updater did not produce its outcome; see the previous step')
          result = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Paired lock update outcome\n\n```json\n')
              summary.write(json.dumps(result, indent=2))
              summary.write('\n```\n')
          if result['status'] == 'conflict':
              raise SystemExit('Action required: resolve the assigned maintenance issue')
          PY
